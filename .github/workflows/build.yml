name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Release upload needs contents: write (repo default token is read-only).
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Puts MSVC cl.exe on PATH for the preset's plain 'cl' compiler.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64

      - name: Configure
        run: cmake --preset msvc-release
        env:
          QTDIR: ${{ env.Qt5_DIR }}

      - name: Build
        run: cmake --build --preset msvc-release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item Build/Release/bin/TsFileViewer.exe artifact/
          # Qt runtime for a portable exe
          windeployqt --release --no-translations --no-opengl-sw artifact/TsFileViewer.exe
          # OpenSSL 1.1.1 x64 for QtNetwork HTTPS (update check). Qt 5.15
          # loads it at runtime and does not ship it (licensing); Git for
          # Windows 2.36.1 (pre-OpenSSL-3 era) is the official binary source.
          # Fixed URL, pinned release asset.
          curl.exe -sSL -o mingit.zip https://github.com/git-for-windows/git/releases/download/v2.36.1.windows.1/MinGit-2.36.1-64-bit.zip
          Expand-Archive mingit.zip mingit
          Copy-Item mingit/mingw64/bin/libssl-1_1-x64.dll artifact/
          Copy-Item mingit/mingw64/bin/libcrypto-1_1-x64.dll artifact/
          Compress-Archive -Path artifact/* -DestinationPath TsFileViewer-${{ github.ref_name }}-win64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsFileViewer-win64
          path: TsFileViewer-*-win64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TsFileViewer-*-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
