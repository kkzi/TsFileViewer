name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Release upload needs contents: write (repo default token is read-only).
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Puts MSVC cl.exe on PATH for the preset's plain 'cl' compiler.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64

      - name: Configure
        run: cmake --preset msvc-release
        env:
          QTDIR: ${{ env.Qt5_DIR }}

      - name: Build
        run: cmake --build --preset msvc-release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item Build/Release/bin/TsFileViewer.exe artifact/
          # Qt runtime for a portable exe
          windeployqt --release --no-translations --no-opengl-sw artifact/TsFileViewer.exe
          # OpenSSL 1.1.1 x64 for QtNetwork HTTPS (update check). Qt 5.15
          # loads it at runtime and does not ship it (licensing); Git for
          # Windows 2.36.1 (pre-OpenSSL-3 era) is the official binary source.
          # Fixed URL, pinned release asset.
          curl.exe -sSL -o mingit.zip https://github.com/git-for-windows/git/releases/download/v2.36.1.windows.1/MinGit-2.36.1-64-bit.zip
          Expand-Archive mingit.zip mingit
          Copy-Item mingit/mingw64/bin/libssl-1_1-x64.dll artifact/
          Copy-Item mingit/mingw64/bin/libcrypto-1_1-x64.dll artifact/
          # PRs have ref_name "N/merge": sanitize for the zip filename.
          $ref = "${{ github.ref_name }}" -replace '/', '-'
          Compress-Archive -Path artifact/* -DestinationPath TsFileViewer-$ref-win64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsFileViewer-win64
          path: TsFileViewer-*-win64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TsFileViewer-*-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Experiment: build on POSIX (no deploy yet — artifacts only, Qt runtime
  # not bundled). macos-15-intel is x86_64: Qt 5.15.2 official binaries have
  # no arm64 build; revisit when the project moves to Qt 6. Qt 5's Linux
  # arch is gcc_64 (linux64 is the Qt 6 name).
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: gcc_64
            artifact: linux64
          - os: macos-15-intel
            arch: macos
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: ${{ matrix.arch }}

      - name: Configure
        run: cmake -B Build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
        env:
          QTDIR: ${{ env.Qt5_DIR }}

      - name: Build
        run: cmake --build Build/ci

      - name: Package
        run: |
          cd Build/Release/bin
          ref="${{ github.ref_name }}"
          tar czf ../../../TsFileViewer-${ref//\//-}-${{ matrix.artifact }}.tar.gz TsFileViewer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsFileViewer-${{ matrix.artifact }}
          path: TsFileViewer-*.tar.gz
